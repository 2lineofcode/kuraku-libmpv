name: macOS media filters

on:
  workflow_dispatch:
  push:
    branches: [kuraku-normalization]
    tags: ['v*-kuraku.*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: brew install nasm
      - run: bash scripts/kuraku/build.sh
      - run: python3 -B test/audio_normalization.py build/kuraku/base
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-media-filters
          path: build/output/*
          if-no-files-found: error
